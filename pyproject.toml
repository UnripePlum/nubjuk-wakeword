[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcu-wakeword"
version = "0.0.0"
description = "Korean wakeword training pipeline for NUBJUK wake word '넙죽아'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UnripePlum" }]
dependencies = [
    "ai-edge-litert",
    "audiomentations",
    "audio_metadata",
    "datasets",
    "mmap_ninja",
    "numpy>=1.26",
    "pandas>=2.1",
    "pymicro-features",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "tensorflow>=2.16",
    "webrtcvad-wheels",
    "qwen-tts>=0.1.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
    "httpx>=0.24",
    "playwright>=1.40",
]
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[project.scripts]
mcu-wakeword = "mcu_wakeword.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/mcu_wakeword_engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
