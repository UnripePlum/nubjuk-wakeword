[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nubjuk-wakeword"
version = "0.0.0"
description = "microWakeWord training pipeline for NUBJUK Korean wake word '넙죽 훈련병'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UnripePlum" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.3",
    "tensorflow>=2.15",
    "piper-tts; platform_system != 'Darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
]
notebook = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[project.scripts]
nubjuk-wakeword = "nubjuk_wakeword.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
